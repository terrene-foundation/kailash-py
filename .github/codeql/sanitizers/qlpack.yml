# CodeQL Model-as-Data pack for kailash-py.
#
# INTENT (2026-04-12): declare the in-house URL masker
# (`dataflow.utils.masking.mask_url`) and log-field sanitizer
# (`dataflow.utils.masking.safe_log_value`) as taint barriers for
# `py/clear-text-logging-sensitive-data`, so the rule stops tracing taint
# from `urlparse` through every parsed field on `self` and flagging
# structured log calls that never emit credentials.
#
# CORRECTION (2026-09-11, #2106): the pack DOES NOT DO THAT, and the
# sentence above is retained only as the record of what was attempted.
# A `summaryModel` row does not declare a barrier at all, and both named
# functions are IN SOURCE, so CodeQL analyses the real body regardless.
# The two rows are inert. See sanitizers.model.yml for the measurements,
# for the third refutation (a barrier cannot remove a name-heuristic
# SOURCE), and for why no row should be added for `fingerprint_secret`.
#
# 2026-08-12 (#2088 / #2040): an attempt to extend this pack with
# `kailash.utils.secure_logging.sanitize_log_value` / `sanitize_log_structure`
# / the `nodes/auth` alias `log_safe` as `py/log-injection` barriers was
# MEASURED not to work and has been reverted. A model row cannot declare a
# barrier for a function whose body is IN SOURCE -- CodeQL analyses the real
# body. The `py/log-injection` barrier for those three lives in the code, as
# the trailing `.replace("\r", " ").replace("\n", " ")` that
# `sanitize_log_value` returns. See sanitizers.model.yml for both refuted
# attempts and the evidence.

name: terrene-foundation/kailash-py-sanitizers
version: 1.0.1
library: true
extensionTargets:
  codeql/python-queries: "*"
dataExtensions:
  - sanitizers.model.yml
