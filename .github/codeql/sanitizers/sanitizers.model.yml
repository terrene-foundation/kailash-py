# CodeQL Model-as-Data (MaD) extensions declaring kailash-py's
# in-house sanitizer barriers for taint analysis.
#
# Origin: workspaces/arbor-upstream-fixes/.session-notes (2026-04-12)
#
# These rows tell CodeQL that two functions in
# `dataflow.utils.masking` preserve VALUE flow but NOT taint flow:
#
#   - mask_url(url) → returns the URL with credentials masked. The
#     return value is byte-equal to the input MINUS the credential
#     fields, so any taint on the input MUST NOT propagate to the
#     return value (the credentials are gone, so there's no
#     credential left to taint anything downstream).
#
#   - safe_log_value(value) → returns str(value). Used as an explicit
#     sanitizer barrier at log call sites whose source variables are
#     taint-traced from URL parsing. The value is byte-identical;
#     the function exists purely to give CodeQL a recognizable barrier.
#
# Without these extensions, CodeQL traces taint from
# `urlparse(connection_string)` through every parsed field on `self`
# (host, port, database, AND password) and flags any logger.* call
# that touches any of them as `py/clear-text-logging-sensitive-data`,
# even when only connection coordinates are emitted. The
# overapproximation cannot be cleared by code refactor alone — the
# canonical fix is to declare the sanitizer barriers here so CodeQL's
# DataFlow library recognizes them as taint stops.
#
# The "value" kind in the row below means "the return value carries
# the same VALUE as the input but NOT the same TAINT" — CodeQL treats
# this as a taint barrier per the dataflow specification at
# https://github.com/github/codeql/blob/main/python/ql/lib/semmle/python/dataflow/new/internal/FlowSummaryImpl.qll

extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: summaryModel
    data:
      # mask_url: arg → ReturnValue, value-only (taint barrier)
      - [
          "dataflow.utils.masking",
          "Member[mask_url]",
          "Argument[0]",
          "ReturnValue",
          "value",
          "manual",
        ]
      # safe_log_value: arg → ReturnValue, value-only (taint barrier)
      - [
          "dataflow.utils.masking",
          "Member[safe_log_value]",
          "Argument[0]",
          "ReturnValue",
          "value",
          "manual",
        ]
      # ---------------------------------------------------------------
      # Issue #2088 / #2040 — the SDK-wide log value sanitizer.
      #
      # Unlike `safe_log_value` above, which the header correctly
      # describes as byte-identical and existing purely to give CodeQL a
      # barrier, these two REMOVE the injection vector: every
      # non-printable character (newline, carriage return, NUL, and the
      # ANSI escapes that rewrite a console) is replaced with a space,
      # and the result is length-capped at a ceiling the caller cannot
      # raise. A value that has passed through them cannot forge a log
      # record, which is precisely the property `py/log-injection`
      # asks about — so declaring them is a statement of what the code
      # does, not a suppression of what it does not.
      #
      # `sanitize_log_structure` is the recursive form for attribute
      # bags (`event_data`, `metadata`); every string leaf it returns
      # went through `sanitize_log_value`, so the same barrier holds.
      #
      # Both are declared under the module path they are IMPORTED from
      # at the call sites (`kailash.utils.secure_logging`).
      # ---------------------------------------------------------------
      # Declared as NEUTRAL below rather than as a `value` summary here.
      # See the § Neutral models block at the end of this file for why --
      # `value` is not a barrier, and that matters for the two rows above
      # too.

  # -------------------------------------------------------------------
  # § Neutral models — the actual taint-barrier mechanism
  #
  # A `summaryModel` row with kind `value` declares that the return
  # value carries the argument's VALUE. That is NOT a taint barrier:
  # value flow is a SUBSET of taint flow, so such a row tells CodeQL the
  # taint propagates, which is the opposite of the intent. (The header
  # above this file describes the two `dataflow.utils.masking` rows as
  # barriers on that basis; that description is inaccurate, and it is
  # why those rows never cleared the findings they were added for.
  # Correcting them is out of scope here -- it changes the disposition
  # of alerts this branch does not touch -- but it is recorded so the
  # next person does not repeat the reasoning.)
  #
  # `neutralModel` with kind `summary` is the declaration that DOES stop
  # taint: it states the function has no flow summary, so nothing
  # propagates from argument to return value. For a sanitizer that is
  # exactly true -- the output is a derived, de-fanged string, not the
  # input.
  #
  # Issue #2088 / #2040. These three genuinely remove the injection
  # vector: every non-printable character (newline, carriage return,
  # NUL, and the ANSI escapes that rewrite a console) is replaced with a
  # space, and the result is capped at a ceiling no call site can raise.
  # A value that has passed through them cannot forge a log record,
  # which is precisely the property `py/log-injection` asks about. The
  # rows assert what the code does; they do not suppress what it does
  # not do.
  # -------------------------------------------------------------------
  - addsTo:
      pack: codeql/python-all
      extensible: neutralModel
    data:
      - ["kailash.utils.secure_logging", "sanitize_log_value", "", "summary", "manual"]
      - [
          "kailash.utils.secure_logging",
          "sanitize_log_structure",
          "",
          "summary",
          "manual",
        ]
      # The `nodes/auth` alias, now a thin wrapper over
      # `sanitize_log_value` with no implementation of its own. Declared
      # so the ~20 call sites in that package are recognized through the
      # name they actually import.
      - ["kailash.nodes.auth._log_hygiene", "log_safe", "", "summary", "manual"]
