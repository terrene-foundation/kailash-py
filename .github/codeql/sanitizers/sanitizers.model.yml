# CodeQL Model-as-Data (MaD) extensions declaring kailash-py's
# in-house sanitizer barriers for taint analysis.
#
# Origin: workspaces/arbor-upstream-fixes/.session-notes (2026-04-12)
#
# These rows tell CodeQL that two functions in
# `dataflow.utils.masking` preserve VALUE flow but NOT taint flow:
#
#   - mask_url(url) → returns the URL with credentials masked. The
#     return value is byte-equal to the input MINUS the credential
#     fields, so any taint on the input MUST NOT propagate to the
#     return value (the credentials are gone, so there's no
#     credential left to taint anything downstream).
#
#   - safe_log_value(value) → returns str(value). Used as an explicit
#     sanitizer barrier at log call sites whose source variables are
#     taint-traced from URL parsing. The value is byte-identical;
#     the function exists purely to give CodeQL a recognizable barrier.
#
# Without these extensions, CodeQL traces taint from
# `urlparse(connection_string)` through every parsed field on `self`
# (host, port, database, AND password) and flags any logger.* call
# that touches any of them as `py/clear-text-logging-sensitive-data`,
# even when only connection coordinates are emitted. The
# overapproximation cannot be cleared by code refactor alone — the
# canonical fix is to declare the sanitizer barriers here so CodeQL's
# DataFlow library recognizes them as taint stops.
#
# The "value" kind in the row below means "the return value carries
# the same VALUE as the input but NOT the same TAINT" — CodeQL treats
# this as a taint barrier per the dataflow specification at
# https://github.com/github/codeql/blob/main/python/ql/lib/semmle/python/dataflow/new/internal/FlowSummaryImpl.qll

extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: summaryModel
    data:
      # mask_url: arg → ReturnValue, value-only (taint barrier)
      - [
          "dataflow.utils.masking",
          "Member[mask_url]",
          "Argument[0]",
          "ReturnValue",
          "value",
          "manual",
        ]
      # safe_log_value: arg → ReturnValue, value-only (taint barrier)
      - [
          "dataflow.utils.masking",
          "Member[safe_log_value]",
          "Argument[0]",
          "ReturnValue",
          "value",
          "manual",
        ]
      # ---------------------------------------------------------------
      # Issue #2088 / #2040 — NO ROW HERE, AND THAT IS THE FINDING.
      #
      # Two model-based attempts to declare
      # `kailash.utils.secure_logging.sanitize_log_value` (and
      # `sanitize_log_structure`, and the `nodes/auth` alias `log_safe`)
      # as a `py/log-injection` barrier were made on this branch and BOTH
      # were MEASURED not to work. They are recorded rather than left in
      # place, because a model row that does nothing looks exactly like a
      # fix and stops the next person from looking for the real one.
      #
      #   1. `summaryModel` kind `value` — states the return value carries
      #      the argument's VALUE. Value flow is a SUBSET of taint flow,
      #      so this tells CodeQL the taint PROPAGATES: the opposite of
      #      the intent. (The two `dataflow.utils.masking` rows above rest
      #      on that same mistaken reading, which is why they never
      #      cleared the findings they were added for. Correcting them
      #      changes the disposition of alerts this branch does not touch,
      #      so it is left alone and recorded here.)
      #
      #   2. `neutralModel` kind `summary` — states the function has no
      #      flow summary. It has no effect on a function that is IN
      #      SOURCE, because CodeQL analyses the real body instead.
      #      Measured: with these rows in place, the analysis of PR #2103
      #      at 2026-08-12T04:56Z still reported all four
      #      `py/log-injection` alerts, each pointing AT the
      #      `sanitize_log_value(...)` call — api_gateway.py:474,516 and
      #      agent_ui.py:455,470.
      #
      # THE MECHANISM THAT DOES WORK IS IN THE CODE, NOT IN THIS FILE.
      # `LogInjection::ReplaceLineBreaksSanitizer` matches a `.replace`
      # attribute call whose first argument is a string literal in
      # ["\r\n", "\n"], so `sanitize_log_value` ends with
      # `.replace("\r", " ").replace("\n", " ")` as its final, returned
      # expression. See the comment at that line for the full reasoning.
      # CONFIRMED 2026-09-11: those alerts are `fixed` on main and no
      # successor alert stands at those sites (#2106).
      #
      # ---------------------------------------------------------------
      # 2026-09-11 (#2044) — A THIRD ATTEMPT TO PRE-EMPT: do NOT add a
      # barrier/sanitizer row here for `fingerprint_secret`. It cannot
      # work, for a reason DIFFERENT from the two above, and the reason
      # is visible in the scan output rather than inferred.
      #
      # For `py/clear-text-logging-sensitive-data` alerts 11465
      # (nexus rate_limit/middleware.py:188) and 11466/11467
      # (dataflow/core/nodes.py:1039,1044), the SARIF for the analysis of
      # main at 938b9089d811 names the SENSITIVE-DATA NODE ITSELF:
      #
      #   11465 relatedLocations[0] "sensitive data (secret)"
      #         -> middleware.py:188:17-52, i.e. the expression
      #            `fingerprint_secret(str(identifier))`
      #         (no codeFlows at all: source and sink coincide)
      #   11466 codeFlows[0][0] "ControlFlowNode for fingerprint_secret()"
      #         -> nodes.py:1035:36-71, the CALL, not a value reaching it
      #
      # The rule classifies the RETURN VALUE of a call whose name matches
      # its sensitive-name heuristic as a SOURCE. A barrier stops FLOW;
      # here there is no flow to stop, so no model row, no `isBarrier`
      # predicate and no custom query barrier can remove the alert. Only
      # the SOURCE CLASSIFICATION could, and that is driven by the
      # identifier name `fingerprint_secret` — whose own docstring says
      # "Fingerprints MUST NOT be treated as secrets".
      #
      # Disposition for that class: a per-alert dismissal carrying a
      # runtime-safety proof (`zero-tolerance.md` Rule 1b), tracked on
      # #2044. The durable fix is to rename the helper so the name stops
      # asserting something it disclaims — 51 non-test call sites across
      # 13 files in 4 packages, so its own shard with a deprecation
      # cycle (`zero-tolerance.md` Rule 6a), not a drive-by.
      # ---------------------------------------------------------------
