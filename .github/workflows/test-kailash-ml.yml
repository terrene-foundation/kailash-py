name: Test kailash-ml

# IT-1 / #2155 — CUDA jobs RETIRED (decision D2, 2026-08-16).
#
# `test-cuda` and `test-cuda-dl` used to live at the bottom of this file,
# routed to `runs-on: [self-hosted, cuda, gpu]` with `continue-on-error: true`
# pending a runner. Re-derived independently before removal:
#   $ gh api repos/terrene-foundation/kailash-py/actions/runners --jq '.total_count'
#   0
#   $ gh api orgs/terrene-foundation/actions/runners --jq '.total_count'
#   0
#   $ gh run list --workflow=gpu-smoke.yml --limit 5
#   cancelled x5, back to 2026-06-07 -- every run queues until cancelled,
#   none ever get assigned a runner
# No self-hosted runner is registered at repo or org level, and
# gpu-smoke.yml (the canary these jobs depended on; also retired, see
# docs/ci/self-hosted-runner.md) has never completed a single run.
# continue-on-error never got exercised because GitHub Actions never
# assigned either job a runner in the first place -- same defect class as
# #2038, and the same disposition #2135 gave kailash-align's test-gpu.
#
# What was removed, and how to restore it once a runner is live:
#   - test-cuda      ran `-m 'cuda'` over tests/unit/ + tests/integration/
#   - test-cuda-dl   ran `-m 'dl'`   over tests/ (torch training on real GPU
#                    hardware -- a different signal than test-dl below,
#                    which still runs the same `-m 'dl'` selection but on a
#                    CPU-only GitHub-hosted runner and is NOT retired)
#   Both selector fixes (issue #2076) are correct and unchanged. The tests
#   they selected remain marked today -- `@pytest.mark.cuda` on
#   test_xgboost_cuda_fits_and_reports_cuda (also `@requires_cuda`, so it
#   SKIPS cleanly under test-base's CPU-only `-m 'not (slow or gpu or
#   bench)'` filter rather than running) and `@pytest.mark.dl` on the 11
#   torch/lightning/transformers modules test-dl already exercises on CPU.
#   Restore both job bodies verbatim from git history (do not re-derive the
#   selectors -- restore them):
#     git log --oneline --all -- .github/workflows/test-kailash-ml.yml | grep -i 2155
#     git show <that-commit>^:.github/workflows/test-kailash-ml.yml
#   once a runner is provisioned and a restored gpu-smoke.yml passes green.

on:
  push:
    branches: [feat/*, feature/*, fix/*, docs/*, session/*, session-*]
    paths:
      - "packages/kailash-ml/**"
      - ".github/workflows/test-kailash-ml.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/kailash-ml/**"
      - ".github/workflows/test-kailash-ml.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "Test variant to run"
        required: false
        default: "base"
        type: choice
        options:
          - base
          - dl
          - rl
          - cuda
          - all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: |
          PYPROJECT_VER=$(python -c "
          import tomllib
          with open('packages/kailash-ml/pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          ")
          INIT_VER=$(python -c "
          import ast, pathlib
          src = pathlib.Path('packages/kailash-ml/src/kailash_ml/_version.py').read_text()
          for node in ast.walk(ast.parse(src)):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if getattr(target, 'id', '') == '__version__':
                          print(ast.literal_eval(node.value))
          ")
          echo "pyproject.toml: $PYPROJECT_VER"
          echo "_version.py:    $INIT_VER"
          if [ "$PYPROJECT_VER" != "$INIT_VER" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PYPROJECT_VER vs _version.py=$INIT_VER"
            exit 1
          fi

  test-base:
    name: Base (Python ${{ matrix.python-version }})
    # Skip release-prep PRs (release/v*) per ci-runners.md MUST Rule 8 —
    # the source-change PRs already exercised this matrix. version-check
    # above stays unguarded to verify pyproject.toml ↔ _version.py
    # consistency on the release-cut diff (release-relevant gate).
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-ml-py${{ matrix.python-version }}-${{ hashFiles('packages/kailash-ml/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-ml-py${{ matrix.python-version }}-

      - name: Install kailash-ml[dev]
        run: |
          uv venv .venv
          # Install root kailash editable — kailash.diagnostics.protocols
          # (PR #570) is not yet on PyPI, so a transitive resolve would miss
          # the module that PR#2+ (issue #567) diagnostics adapters import.
          #
          # ISSUE #2023 SIBLING DECLARATION — measured, do not re-derive.
          # Selection: packages/kailash-ml/tests/unit/ -m 'not (slow or gpu or bench)'
          #            (1924 tests collected)
          # Probe: a pytest plugin reporting len(sys.modules) per sibling at
          # collection finish, run against this exact selection.
          #   dataflow      -> 0 modules  NOT exercised
          #   kailash_align -> 0 modules  NOT exercised
          #   kailash_ml    -> 138        (the package under test)
          #   kailash       -> 213        editable, this tree
          # The two files under tests/unit/rl/ that mention `kailash_align`
          # reference it only in a mock side_effect STRING and a docstring —
          # neither is an import. So no sibling editable install is warranted
          # here; adding one would lengthen a 5-version matrix for no benefit.
          # Resolution: kailash = editable (this tree); kailash-ml = editable
          # (this tree); dataflow / kailash-align = whatever the transitive
          # resolve produces, and that is FINE because no code path reaches them.
          uv pip install -e "." --python .venv/bin/python
          uv pip install -e "packages/kailash-ml[dev]" --python .venv/bin/python

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check packages/kailash-ml/src/ packages/kailash-ml/tests/ --select=E9,F63,F7,F82

      - name: Test (unit + integration)
        timeout-minutes: 10
        run: |
          .venv/bin/python -m pytest \
            packages/kailash-ml/tests/unit/ \
            -m 'not (slow or gpu or bench)' \
            --maxfail=10 -q --timeout=30

      - name: Coverage
        if: matrix.python-version == '3.12'
        run: |
          # Coverage must install the [dl] extra AND run tests/integration/
          # — the unit tests use `pytest.importorskip("torch")`, so without
          # torch installed they SKIP silently and dl.py (596 stmts) drops
          # coverage to ~23%. The integration tests exercise the real torch
          # surface and are the only place dl.py / every plot_* / grad_cam /
          # lr_range_test / diagnose_* path actually runs.
          #
          # Also install the root `kailash` package editable from the local
          # tree — `kailash.diagnostics.protocols` (PR #570) has not been
          # released to PyPI yet, so a transitive `kailash>=2.8.9` resolve
          # from PyPI would miss the module the integration tests import.
          uv pip install -e "." --python .venv/bin/python
          uv pip install -e "packages/kailash-ml[dl,dev,stats]" --python .venv/bin/python
          # kailash-ml declares `kailash-dataflow>=2.11.3`, so the line above
          # resolves dataflow from PyPI. Paired with the root `kailash`
          # installed editable from this tree, that is an IMPOSSIBLE combination
          # the monorepo never ships: the feature-store materialise path runs
          # DataFlow Express `upsert`, which calls
          # `kailash.db.dialect._validate_identifier`. That helper gained a
          # REQUIRED keyword-only `max_length` (per-dialect identifier budgets,
          # #1971 — a 100-char identifier accepted here is truncated by
          # PostgreSQL at 63 and silently ALIASES two models onto one table).
          # PyPI dataflow 2.19.1 still calls it positionally
          # (`dataflow/core/nodes.py:3620`), so every materialise raised
          # `TypeError: _validate_identifier() missing 1 required keyword-only
          # argument: 'max_length'`.
          #
          # Install dataflow editable so this job tests the LOCKSTEP pairing
          # that actually ships — the same discipline already applied to the
          # root package and to kailash-align above, at the bridge boundary.
          uv pip install -e "packages/kailash-dataflow" --python .venv/bin/python
          # kailash-ml integration tests import `kailash_align` via
          # test_rl_align_cross_sdk_wiring.py (cross-SDK RL protocol wiring).
          # Install kailash-align editable so the test collects cleanly.
          # Per rules/deployment.md § "Sibling-Package CI Installs Root
          # SDK Editable For Unreleased Core Modules" — the same discipline
          # applies bi-directionally at the bridge boundary.
          uv pip install -e "packages/kailash-align[dev]" --python .venv/bin/python
          # pytest-httpserver for test_drift_alerting_wiring webhook tests
          uv pip install pytest-cov pytest-httpserver --python .venv/bin/python
          #
          # ISSUE #2023 SIBLING DECLARATION — measured, do not re-derive.
          # Selection: packages/kailash-ml/tests/unit/ + tests/integration/
          #            -m 'not (slow or gpu or bench)'  (2493 tests collected)
          #   dataflow      -> 112 modules  EXERCISED -> installed editable above
          #   kailash_align -> 13  modules  EXERCISED -> installed editable above
          #   kailash_ml    -> 139          (the package under test, editable)
          #   kailash       -> 251          editable, this tree
          # This step is the ONE that already had the right answer; the two
          # installs above are what #2023 asks every other site to justify.
          .venv/bin/python -m pytest \
            packages/kailash-ml/tests/unit/ \
            packages/kailash-ml/tests/integration/ \
            -m 'not (slow or gpu or bench)' \
            --cov=packages/kailash-ml/src/kailash_ml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -q --timeout=60

  test-dl:
    name: Deep Learning
    needs: version-check
    # workflow_dispatch-only; release/v* exclusion is implicit (release
    # branches don't carry workflow_dispatch inputs) but kept explicit
    # per ci-runners.md MUST Rule 8.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.variant == 'dl' || inputs.variant == 'all') &&
      !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install kailash-ml[dl,dev]
        run: |
          uv venv .venv
          # ISSUE #2023 SIBLING DECLARATION — measured, do not re-derive.
          # Selection: packages/kailash-ml/tests/ -m 'dl'  (updated by #2076;
          # was 'dl or deep_learning', which selected zero tests — see the
          # Test DL step below. The module-import-count measurement below is
          # UNCHANGED by that rename: naming the whole tests/ dir imports
          # every module at collection time regardless of the -m expression's
          # text, so the sibling counts still hold.)
          #   dataflow      -> 112 modules  EXERCISED at COLLECTION time
          #   kailash_align -> 13  modules  EXERCISED at COLLECTION time
          #   kailash_ml    -> 139          (package under test, editable)
          #   kailash       -> 251          editable, this tree
          # Naming the whole tests/ dir means pytest IMPORTS every test module
          # before the -m filter deselects anything, so a PyPI-resolved dataflow
          # can break this step at collection — the exact #2023 trap, one layer
          # earlier than the runtime TypeError that motivated the issue.
          # Hence both siblings are installed editable below.
          uv pip install -e "." --python .venv/bin/python
          uv pip install -e "packages/kailash-ml[dl,dev]" --python .venv/bin/python
          uv pip install -e "packages/kailash-dataflow" --python .venv/bin/python
          uv pip install -e "packages/kailash-align" --python .venv/bin/python

      - name: Test DL
        timeout-minutes: 15
        # Issue #2076 FIX: `-m 'dl or deep_learning'` selected ZERO tests
        # (2602 collected, 2602 deselected, pytest exit 5) because neither
        # marker existed anywhere in the package or its
        # [tool.pytest.ini_options] markers list — this dispatch-only job
        # failed on every dispatch. Disposition: MARK the tests (not
        # path-based — DL-relevant files are scattered across tests/unit/,
        # tests/integration/, tests/integration/autolog/, and
        # tests/regression/, not grouped under one directory). `dl` is now
        # registered in packages/kailash-ml/pyproject.toml and applied to
        # every torch/lightning/transformers test module (11 files).
        # Verified: `-m dl` over packages/kailash-ml/tests/ collects
        # 79/2606 (was 0/2602); `accelerate>=1.1.0` was ALSO added to the
        # [dl] extra — wiring this selector in for the first time surfaced
        # a real ImportError in transformers.Trainer's PyTorch backend,
        # which requires accelerate but had it undeclared.
        run: |
          .venv/bin/python -m pytest \
            packages/kailash-ml/tests/ \
            -m 'dl' \
            --maxfail=5 -q --timeout=120

  test-rl:
    name: Reinforcement Learning
    needs: version-check
    # workflow_dispatch-only; release/v* exclusion is implicit but kept
    # explicit per ci-runners.md MUST Rule 8.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.variant == 'rl' || inputs.variant == 'all') &&
      !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install kailash-ml[rl,dev]
        run: |
          uv venv .venv
          # ISSUE #2023 SIBLING DECLARATION — measured, do not re-derive.
          # Selection (updated by issue #2076 — was a whole-tests/-tree
          # marker selection matching zero tests; now path-based, scoped to
          # the two directories that actually hold the RL suite):
          #   packages/kailash-ml/tests/unit/rl/ packages/kailash-ml/tests/integration/rl/
          #   -m 'not (slow or gpu or bench)'  (31 tests collected)
          #   dataflow      -> 0  modules  NOT exercised (no rl/ file imports it,
          #                    even at whole-tree collection — this narrowed
          #                    selection makes that legible; NOT installed)
          #   kailash_align -> EXERCISED, but only via `importlib` INSIDE test
          #                    bodies (test_rl_align_cross_sdk_wiring.py), not
          #                    at module-scope import time — installing it
          #                    editable still changes real pass/skip outcomes
          #                    (measured: 29 passed/2 skipped absent vs.
          #                    30 passed/1 skipped installed), so it stays.
          #   kailash_ml    -> package under test, editable
          #   kailash       -> editable, this tree
          uv pip install -e "." --python .venv/bin/python
          uv pip install -e "packages/kailash-ml[rl,dev]" --python .venv/bin/python
          uv pip install -e "packages/kailash-align" --python .venv/bin/python

      - name: Test RL
        timeout-minutes: 15
        # Issue #2076 FIX: `-m 'rl or reinforcement_learning'` over the whole
        # tests/ tree selected ZERO tests (2602 deselected, pytest exit 5) —
        # neither marker exists anywhere in the package, so this
        # dispatch-only job failed on every dispatch. Disposition: PATH-BASED
        # selection, not marking — the RL suite already lives entirely under
        # two dedicated directories (tests/unit/rl/, tests/integration/rl/),
        # so naming them directly is more precise than inventing an `rl`
        # marker no other file needs. Verified: 31 tests collected (was 0);
        # 30 passed, 1 skipped (an opt-in KAILASH_ML_RUN_TRL_E2E=1 test that
        # downloads a real model — intentionally not force-enabled here).
        run: |
          .venv/bin/python -m pytest \
            packages/kailash-ml/tests/unit/rl/ \
            packages/kailash-ml/tests/integration/rl/ \
            -m 'not (slow or gpu or bench)' \
            --maxfail=5 -q --timeout=120

  # ---------------------------------------------------------------------------
  # CUDA jobs (test-cuda, test-cuda-dl) — RETIRED, #2155.
  # See the top-of-file header comment for the full measurement, what each
  # job's selector was, and the exact restore procedure. Do not re-add a
  # stub/placeholder job here — restore the real bodies from git history.
  # ---------------------------------------------------------------------------
