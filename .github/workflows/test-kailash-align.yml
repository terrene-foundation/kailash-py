name: Test kailash-align

on:
  push:
    branches: [feat/*, feature/*, fix/*, docs/*, session/*, session-*]
    paths:
      - "packages/kailash-align/**"
      - ".github/workflows/test-kailash-align.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/kailash-align/**"
      - ".github/workflows/test-kailash-align.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: |
          PYPROJECT_VER=$(python -c "
          import tomllib
          with open('packages/kailash-align/pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          ")
          INIT_VER=$(python -c "
          import ast, pathlib
          src = pathlib.Path('packages/kailash-align/src/kailash_align/_version.py').read_text()
          for node in ast.walk(ast.parse(src)):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if getattr(target, 'id', '') == '__version__':
                          print(ast.literal_eval(node.value))
          ")
          echo "pyproject.toml: $PYPROJECT_VER"
          echo "_version.py:    $INIT_VER"
          if [ "$PYPROJECT_VER" != "$INIT_VER" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PYPROJECT_VER vs _version.py=$INIT_VER"
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    # Skip release-prep PRs (release/v*) per ci-runners.md MUST Rule 8 —
    # the source-change PRs already exercised this matrix. version-check
    # above stays unguarded to verify pyproject.toml ↔ _version.py
    # consistency on the release-cut diff (release-relevant gate).
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-align-py${{ matrix.python-version }}-${{ hashFiles('packages/kailash-align/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-align-py${{ matrix.python-version }}-

      - name: Install kailash-align[dev]
        run: |
          uv venv .venv
          # Install root kailash first so kailash.diagnostics.protocols resolves
          # (not yet on PyPI; PR#2-#4 of issue #567 depend on it)
          uv pip install -e "." --python .venv/bin/python
          # Install kailash-ml editable so kailash_ml.rl.align_adapter
          # resolves. The sub-package module landed in the kailash-ml 1.0
          # milestone branch and is not yet on PyPI; align tests import it
          # directly per `rules/deployment.md` § "Sibling-Package CI
          # Installs Root SDK Editable For Unreleased Core Modules".
          #
          # ISSUE #2023 SIBLING DECLARATION — measured, do not re-derive.
          # Selection: packages/kailash-align/tests/ -m 'not (gpu or slow)'
          #            (485 tests collected)
          # Probe: sibling module count in sys.modules at collection finish.
          #   kailash_ml    -> 95 modules  EXERCISED -> installed editable below
          #   dataflow      -> 0  modules  NOT exercised -> deliberately NOT
          #                    installed. kailash-ml eagerly imports
          #                    kailash_ml.features, and features/ does name
          #                    dataflow — but every one of those imports is
          #                    either inside `if TYPE_CHECKING:` or inside a
          #                    function body, so none fires at import time.
          #                    Adding dataflow here would pull the DB stack into
          #                    a 5-version matrix for zero reachable code.
          #   kailash_align -> 23          (the package under test, editable)
          #   kailash       -> 213         editable, this tree
          uv pip install -e "packages/kailash-ml" --python .venv/bin/python
          uv pip install -e "packages/kailash-align[dev]" --python .venv/bin/python

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check packages/kailash-align/src/ packages/kailash-align/tests/ --select=E9,F63,F7,F82

      - name: Test (unit)
        timeout-minutes: 10
        run: |
          .venv/bin/python -m pytest \
            packages/kailash-align/tests/ \
            -m 'not (gpu or slow)' \
            --maxfail=10 -q --timeout=30

      - name: Coverage
        if: matrix.python-version == '3.12'
        run: |
          uv pip install pytest-cov --python .venv/bin/python
          .venv/bin/python -m pytest \
            packages/kailash-align/tests/ \
            -m 'not (gpu or slow)' \
            --cov=packages/kailash-align/src/kailash_align \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -q --timeout=30

  # ISSUE #2076 — the `test-gpu` job lived HERE and is REMOVED, tracked by
  # #2135. `-m 'gpu'` selected ZERO tests (485 collected, 485 deselected,
  # pytest exit 5) because no test in packages/kailash-align/ ever carried
  # the `gpu` marker — it is registered in pyproject.toml's
  # [tool.pytest.ini_options] markers ("gpu: Tests requiring GPU (slow,
  # skipped by default)") but was declared aspirationally and never applied.
  # `grep -rn "cuda.is_available\|skipif.*cuda\|skipif.*gpu" packages/
  # kailash-align/tests/` returns nothing; every torch-touching test in the
  # package is explicitly documented CPU-only (tests/test_pipeline.py:3
  # "unit tests -- no GPU, no model loading"). A job whose selector can
  # only ever match nothing is a stub gate — removed rather than shipped
  # degraded, same disposition as `test-root-regression` in
  # unified-ci.yml (#2081/#2002). Restore it, along with the `run-gpu`
  # workflow_dispatch input, once #2135 lands real GPU-hardware tests
  # (LoRA/DPO training step, bf16 mixed precision, device placement) —
  # follow kailash-ml's `test-cuda` pattern (`@pytest.mark.skipif(not
  # torch.cuda.is_available(), ...)` alongside the already-registered
  # `@pytest.mark.gpu`) in `.github/workflows/test-kailash-ml.yml`. Do not
  # re-derive; restore the removed job body from this file's git history
  # (the PR that closed #2076) once tests exist to select.

  inter-package:
    name: Inter-Package (align + dev ML)
    # Skip release-prep PRs (release/v*) per ci-runners.md MUST Rule 8 —
    # release-prep diffs are metadata-only; cross-package compat already
    # verified on the source-change PRs that the release bundles.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dev kailash-ml + kailash-align
        run: |
          uv venv .venv
          # ISSUE #2023 SIBLING DECLARATION — measured, do not re-derive.
          # Selection: packages/kailash-align/tests/ -m 'not (gpu or slow)'
          #            (485 tests collected) — same selection as the `test` job.
          #   kailash_ml    -> 95 modules  EXERCISED -> installed editable below
          #                    (this job's whole purpose: align against DEV ml)
          #   dataflow      -> 0  modules  NOT exercised -> not installed
          #   kailash_align -> 23          (package under test, editable)
          #   kailash       -> 213         editable, this tree
          uv pip install -e "." --python .venv/bin/python
          uv pip install -e "packages/kailash-ml[dev]" --python .venv/bin/python
          uv pip install -e "packages/kailash-align[dev]" --python .venv/bin/python

      - name: Test align with dev ML
        timeout-minutes: 10
        run: |
          .venv/bin/python -m pytest \
            packages/kailash-align/tests/ \
            -m 'not (gpu or slow)' \
            --maxfail=10 -q --timeout=30
