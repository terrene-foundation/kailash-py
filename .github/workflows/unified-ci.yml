name: CI Pipeline

# Runs on GitHub-hosted ubuntu-latest runners.
# Push to feature branches runs Tier 1 unit tests (fast).
# PRs to main run the same checks. Manual dispatch allows full test suite.
#
# Issue #2133 (Option 2 of the co-owner-ratified D1 disposition, Option 3
# tracked separately as a branch-protection change requiring owner action —
# see the PR body): `push:` intentionally does NOT include `main` — adding
# it would cost one full 4-version matrix (~45 min) on every merge, and this
# repo has an active CI-spend concern. Instead this `schedule:` trigger runs
# the identical matrix against `main` nightly, so a main regression from two
# independently-green PRs merging together (#2038's failure mode, one layer
# over) is caught within a day instead of by the next unrelated PR that
# happens to touch the same code. `schedule` events check out the DEFAULT
# branch (main) with no `paths:` filtering — every job below runs in full
# regardless of what changed, which is the point: it verifies what actually
# ships, not what one PR's diff touched.
on:
  push:
    branches: [feat/*, feature/*, fix/*, docs/*, session/*, session-*]
    paths:
      - "src/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/unified-ci.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/unified-ci.yml"
  schedule:
    # 02:23 UTC nightly — off-the-hour to avoid GitHub Actions' top-of-hour
    # scheduling congestion. Verifies main independent of any PR's path
    # filters (issue #2133).
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      test-mode:
        description: "Test execution mode"
        required: false
        default: "fast"
        type: choice
        options:
          - fast # Tier 1 unit tests only (no external dependencies)
          - full # All tests including slow ones
          - infrastructure # Docker infrastructure tests only

permissions:
  contents: read
  # Security review (this PR): downgraded from `write`. The only
  # pull-requests API call in this file is `github.rest.pulls.list` in
  # check-duplicate (read-only); nothing here creates/updates a PR,
  # comment, or review, so `write` was unused scope.
  pull-requests: read

concurrency:
  # Improved concurrency: Group by PR number for PR events, unique run_id for push events
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Skip push CI when an open PR already covers the branch
  check-duplicate:
    name: Check for Duplicate Run
    # Skip release-prep PRs (release/v*) per ci-runners.md MUST Rule 8.
    # On push events, head_ref is empty so this expression evaluates to true,
    # leaving push-event behavior intact. On pull_request events from
    # release/v*, this short-circuits before the duplicate-PR check fires.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if push event should be skipped
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('skip', 'false');
              return;
            }
            const branch = context.ref.replace('refs/heads/', '');
            try {
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${branch}`
              });
              core.setOutput('skip', prs.length > 0 ? 'true' : 'false');
            } catch (error) {
              core.setOutput('skip', 'false');
            }

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: check-duplicate
    # Skip release-prep PRs (release/v*) per ci-runners.md MUST Rule 8 —
    # release diffs are metadata-only (pyproject.toml version anchors +
    # CHANGELOG); the source-change PRs the release bundles already
    # exercised this matrix. Saves ~45 min × matrix-size per release cycle.
    if: needs.check-duplicate.outputs.should-skip != 'true' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    # 25 -> 40: the Tier-2 step's own budget rose to 25 minutes (see there).
    timeout-minutes: 40
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          uv venv .venv
          # Per #890 slim-core refactor: extras renamed.
          # OLD: cli/database/postgres/mysql/files/distributed/http/mfa/otel
          # NEW: db-postgres/db-mysql/db-sqlite/http-client/auth-azure/telemetry/redis/trust
          # `cli` and `files` were folded into core/server respectively.
          # Issue #2038: `vault` (hvac) and `aws-secrets` (boto3) added, plus
          # matplotlib + scikit-learn below. These are NOT decoration — with the
          # Tier-2 step no longer swallowing failures, 8 Tier-2 tests that used
          # to die on ModuleNotFoundError now RUN and pass:
          #   hvac         -> test_todo027_credential_manager.py TestVaultBackend (3)
          #   boto3        -> test_todo027_credential_manager.py TestAWSSecretsBackend (2)
          #   matplotlib   -> visualization/test_visualization_consolidated.py (2)
          #   scikit-learn -> test_behavior_analysis_comprehensive.py::test_isolation_forest_model (1)
          # Provisioning the dependency is the right fix here; skipping or
          # quarantining these would have recorded a dependency gap as a test
          # defect.
          uv pip install -e ".[dev,server,http-client,db-postgres,db-mysql,db-sqlite,redis,monitoring,auth,auth-azure,trust,mcp,scheduler,telemetry,data,vault,aws-secrets]" --python .venv/bin/python
          uv pip install -e packages/kailash-mcp --python .venv/bin/python
          # matplotlib / scikit-learn have no declared extra — they are test-only
          # dependencies of the two Tier-2 files named above.
          uv pip install numpy matplotlib scikit-learn --python .venv/bin/python

      - name: Lint (ruff)
        run: .venv/bin/ruff check src/ tests/ --select=E9,F63,F7,F82

      - name: Type check (pyright)
        continue-on-error: true # 3001 pre-existing errors — tracked in #73
        run: |
          uv pip install pyright --python .venv/bin/python
          .venv/bin/pyright src/kailash/ --pythonversion ${{ matrix.python-version }} --level error 2>&1 | tail -5

      - name: Test (Tier 1 — unit tests)
        timeout-minutes: 15
        run: |
          .venv/bin/python -m pytest \
            tests/unit/ \
            tests/trust/plane/unit/ \
            tests/security/ \
            -m 'not (slow or performance or integration or e2e or requires_docker or requires_postgres or requires_mysql or requires_redis or requires_ollama)' \
            --maxfail=10 -q -p no:xdist --timeout=30

      # The #2023 sibling-install lint lives in tests/regression/, which the
      # (unshipped, see #2081) test-root-regression job would have run. Named
      # explicitly here so AC#3 of #2023 is actually enforced on every PR rather
      # than nominally enforced by a job that does not exist. It is a pure
      # filesystem scan over .github/workflows/*.yml — no runtime, no hang risk,
      # under 2 seconds. Fold it back into the regression job when #2081 lands.
      - name: Test (regression lint — workflow sibling declarations, #2023)
        timeout-minutes: 5
        run: |
          .venv/bin/python -m pytest \
            tests/regression/test_issue_2023_sibling_install_declarations.py \
            -q -p no:xdist --timeout=60

      - name: Test (Tier 2 — integration runtime tests)
        id: tier2
        # Raised from 10 minutes. On PRE-CHANGE code this step TIMED OUT at 10
        # minutes on Python 3.11 and 3.12 in every run inspected (e.g. runs
        # 31480330313, 31478307416, 31476919718) — and every one of those jobs
        # still reported SUCCESS, because `continue-on-error: true` swallowed
        # the timeout as well as the failures. The Tier-2 suite had therefore
        # never been observed to COMPLETE on this repo's CI on two of the four
        # interpreters. With `--maxfail` lifted it completes in under 3 minutes.
        timeout-minutes: 25
        # Issue #2038 COMPLETE: `continue-on-error: true` is REMOVED and Tier 2
        # now gates the merge exactly as Tier 1 does.
        #
        # This flag came off ONCE BEFORE (d1f5ea3fb, the block below) and had to
        # be put BACK (1f6a95ba8) when a SECOND, unrelated cause surfaced: the
        # tier then reported 174 failed / 58 errors on the runner from thread and
        # file-descriptor exhaustion — 130 `RuntimeError: can't start new thread`
        # plus 90 `sqlite3.OperationalError: disk I/O error` — which reproduced
        # against unmodified code and so belonged to no PR that saw it.
        #
        # That second cause is #2078, fixed in PR #2097 (merged 590983dc9):
        # `PythonCodeNode` set an address-space rlimit (`RLIMIT_AS`) PROCESS-WIDE
        # and never restored it, so once any node executed, every later thread
        # stack and file descriptor in the same pytest process drew on a capped
        # address space. One cause, both symptom families.
        #
        # Both preconditions this block used to demand are now met, MEASURED from
        # the step summaries rather than the job conclusion (a green JOB proved
        # nothing while this flag was set):
        #   Python 3.11  2582 passed, 47 skipped, 4 deselected, 1 xpassed
        #   Python 3.12  2582 passed, 47 skipped, 4 deselected, 1 xpassed
        #   Python 3.13  2582 passed, 47 skipped, 4 deselected, 1 xpassed
        #   Python 3.14  2582 passed, 47 skipped, 4 deselected, 1 xpassed
        # Zero failed, zero errors, all four interpreters.
        #
        # The paired annotation step below is DELETED with the flag, as that
        # block instructed: it existed only to make a non-blocking failure
        # visible. A blocking step needs no annotation to be seen.
        # Issue #2038: `continue-on-error: true` REMOVED. Tier 2 now gates the
        # merge exactly as Tier 1 does, and `gh pr checks` is once again a
        # discriminating instrument for integration behaviour.
        #
        # The removed flag's comment read "Tier 2 has thread/I/O tests that may
        # fail on CI runners". Measured against three consecutive full Tier-2
        # runs, that was true of exactly ONE test out of 46 failures:
        #   * 45 failed 3/3 — consistent, not flaky, and structurally invisible
        #     for as long as this flag was set. All 45 are now FIXED:
        #       15  test_workflow_scheduler.py — sys.modules stubbed the parent
        #           `apscheduler` package, so the `apscheduler.events` import
        #           added for issue #914 could not resolve
        #        8  runtime/test_distributed_runtime.py — MagicMock(spec=TaskQueue)
        #           does not expose the instance attr `_default_visibility_timeout`
        #        6  mcp_server/test_oauth.py — ResourceServer now requires an
        #           absolute RFC 9728 `resource` URL; the fixture passed a bare
        #           audience token
        #        7  mock_node_factory (tests/conftest.py) built Node subclasses
        #           with no concrete `run`, so every one was abstract
        #        1  runtime/test_docker.py — expected module path went stale
        #           when the file moved out of tests/unit/
        #        8  missing optional deps — fixed by the install step above
        #   * 1 flaked (1/3): runtime/test_phase0d_optimizations.py::
        #     test_repeated_execution_performance, an absolute wall-clock bound.
        #     Quarantined INDIVIDUALLY at the test with a documented skip and a
        #     reason explaining why xfail(strict=True) cannot work for a test
        #     that passes most runs.
        #
        # If this step goes red, a Tier-2 test genuinely regressed. Do NOT
        # restore continue-on-error; quarantine the individual test instead.
        run: |
          .venv/bin/python -m pytest \
            tests/tier2_integration/ \
            -m 'not (requires_docker or requires_postgres or requires_mysql or requires_redis or requires_ollama)' \
            --maxfail=400 -q -p no:xdist --timeout=60 -rf


  # ISSUE #2002 — the `test-root-regression` job lived HERE and is NOT SHIPPED,
  # pending #2081. Root tests/regression/ cannot run to completion on this
  # repo's ubuntu-latest runner: three CI runs, each with a sharper instrument,
  # ended in a timeout or a truncated `--maxfail`. The last one
  # (--timeout-method=signal, --timeout=60, --maxfail=30) enumerated 30 hangs
  # across 8 files having executed 757 of 1916 tests in 23m40s — so 30 is a
  # floor, not a count. The identical selection is 1916 passed / 0 failed in
  # 217s on macOS.
  #
  # A 40-minute job that cannot complete is pure cost on every PR, and making
  # it non-blocking would only make that cost silent. So it is removed rather
  # than shipped degraded, and #2002 stays open with #2081 as its blocker.
  #
  # The complete job — the extras set (note `shamir`, without which five EATP
  # vault tests fail), the five editable sibling installs the suite needs to
  # COLLECT at all, and the marker filter mirroring the DataFlow regression
  # step — is preserved in PR #2077's history and referenced from #2081.
  # Restore it from there once the hangs are fixed; do not re-derive it.
  #
  # One finding from that work is worth acting on independently of #2002: the
  # root pytest.ini sets `timeout_method = thread`, and a thread-method timeout
  # CANNOT kill a test blocked in a C call. Two of the three runs above were
  # unreadable for exactly that reason — pytest-timeout printed its banner and
  # the process carried on. `signal` is the enforceable method on Linux/macOS.

  test-pact:
    name: Test PACT (Python 3.11)
    needs: check-duplicate
    # Skip release-prep PRs (release/v*) per ci-runners.md MUST Rule 8.
    if: needs.check-duplicate.outputs.should-skip != 'true' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py3.11-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py3.11-

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[trust]" --python .venv/bin/python
          uv pip install -e "packages/kailash-pact[dev]" --python .venv/bin/python

      - name: Test kailash-pact
        timeout-minutes: 5
        run: |
          cd packages/kailash-pact
          ../../.venv/bin/python -m pytest tests/ \
            --maxfail=5 -q --timeout=120

  test-dataflow:
    name: Test DataFlow Unit Suite (Tier 1)
    needs: check-duplicate
    # Re-applies issue #898 gate (PR #968 was reverted; this is a fresh
    # implementation atop issue #979's tier-1 cleanup — S1+S2a+S-EV+S3+S4+S5a).
    # Paths cover BOTH the package and the core SDK (per ci-runners.md Rule 6 —
    # filter MUST follow the transitive dep graph, not just package dir).
    # Skip release-prep PRs (release/v*) per ci-runners.md MUST Rule 8.
    if: needs.check-duplicate.outputs.should-skip != 'true' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py3.11-dataflow-${{ hashFiles('pyproject.toml', 'packages/kailash-dataflow/pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py3.11-dataflow-

      - name: Install dependencies
        # Per deployment.md § "Sibling-Package CI Installs Root SDK Editable":
        # root kailash MUST be installed editable BEFORE the sub-package so
        # `kailash.<new_module>` resolves to the local checkout, not stale PyPI.
        run: |
          uv venv .venv
          uv pip install -e "." --python .venv/bin/python
          uv pip install -e "packages/kailash-dataflow[dev]" --python .venv/bin/python

      - name: Test DataFlow tier-1 unit suite
        timeout-minutes: 10
        # ZERO `-m` flag here: pytest.ini::addopts is the SOLE marker filter
        # location per S1 CRIT-B fix (packages/kailash-dataflow/pytest.ini).
        # `--timeout=120` matches the addopts entry; explicit here as defense
        # against pytest-timeout plugin auto-discovery regressions.
        #
        # Issue #1010 / #1002 AC#3 closure: the setsid + 150s polling +
        # SIGKILL wrapper that previously lived here is GONE. The wrapper
        # masked non-daemon aiosqlite worker threads that blocked
        # _Py_Finalize at interpreter exit. Two-part fix landed:
        #   - PR #1014 (a8b54a97): fresh-loop disconnect for the
        #     _shared_pools SQLite branch.
        #   - PR #1016 (a9bc2c7c): conftest monkey-patch forcing every
        #     aiosqlite worker thread to daemon=True, so survivors of
        #     close() do not block threading._shutdown().
        # PR #1016 CI on Linux/Python 3.11 completed end-to-end in 76s
        # with the setsid wrapper still in place — pytest exited
        # naturally well before the 150s polling threshold. Removing
        # the wrapper now makes any future regression visible at the
        # 10-min step timeout instead of being silently SIGKILLed.
        run: |
          cd packages/kailash-dataflow
          ../../.venv/bin/python -m pytest tests/unit/ \
            --maxfail=10 -q --timeout=120

      - name: Test DataFlow infra-free regression gates
        timeout-minutes: 10
        # tests/regression/ is a MIXED dir: infra-free gates (the engine.py
        # pyright invariant, codeql/security/import-discipline checks) PLUS
        # Postgres/Redis-requiring tests. This [dev]-only runner has no infra,
        # so the marker filter below excludes every infra-requiring test and
        # runs only the infra-free gates (the engine pyright gate among them).
        # The infra-requiring regression tests are exercised by the
        # infrastructure workflow, not here.
        #
        # Explicit `-m` is REQUIRED and intentionally overrides pytest.ini's
        # addopts marker filter: addopts excludes requires_* but NOT
        # integration/e2e, which this directory DOES contain. (The unit step
        # above keeps zero `-m` per the addopts-is-sole-filter convention; that
        # convention holds for tests/unit/, which has no integration tests.)
        run: |
          cd packages/kailash-dataflow
          ../../.venv/bin/python -m pytest tests/regression/ \
            -m "not (requires_postgres or requires_mysql or requires_redis or requires_docker or integration or e2e)" \
            --maxfail=10 -q --timeout=120

  # F-REGRESSION-INFRA-CI: the dataflow tests/regression/ Postgres+Redis tests
  # (#1249 / #1252 tenant-isolation-leak SECURITY regressions + #979 S1
  # preconditions) were run by NO CI job — the test-dataflow job above excludes
  # every requires_* marker, and test-with-infrastructure.yml runs no pytest
  # (it is a config validator). This job provides Postgres + Redis via service
  # containers and runs exactly the requires_postgres/requires_redis-marked
  # regression tests. The explicit `-m` intentionally overrides pytest.ini's
  # addopts marker filter (same convention as the infra-free step above).
  test-dataflow-infra:
    name: Test DataFlow Infra Regression (Postgres/Redis)
    needs: check-duplicate
    if: needs.check-duplicate.outputs.should-skip != 'true' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    # 15 -> 45: now carries the 10-min DataFlow step plus the 30-min root
    # regression infra step added for #2002 AC#2, plus install.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kailash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d kailash_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The dataflow test_suite fixture (tests/conftest.py) reads
      # TEST_DATABASE_URL; its default points at :5434, so set it explicitly to
      # the service-mapped :5432. DATAFLOW_TEST_MODE matches the conftest default.
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/kailash_test
      DATAFLOW_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py3.11-dataflow-infra-${{ hashFiles('pyproject.toml', 'packages/kailash-dataflow/pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py3.11-dataflow-infra-

      - name: Install dependencies
        # Root kailash editable BEFORE the sub-package (deployment.md sibling-CI
        # rule). db-postgres (asyncpg) + redis provide the async drivers; the
        # dataflow [postgres-sync] extra provides psycopg2-binary, REQUIRED by the
        # auto_migrate synchronous DDL path the tenant-isolation tests exercise
        # (DataFlow is async-first but creates tables via the sync DDL executor).
        #
        # The extras list is WIDER than this job's DataFlow step needs, because
        # the root-regression infra step added below shares this venv and root
        # `tests/regression/` is collected as a whole directory — pytest imports
        # every module in it before `-m` selects anything. On the first CI run
        # of that step, the narrow ".[db-postgres,redis]" install produced eight
        # COLLECTION errors, none of which was a test defect:
        #   PyNaCl    -> test_issue_1316_*.py (trust extra)
        #   pact      -> test_issue_1510_bh5_circuit_breaker.py
        #   qrcode    -> test_issue_1815_oidc_nonce_pkce.py, test_issue_1835_*.py (auth extra)
        #   filelock  -> test_issue_1912_*.py, test_issue_2027_*.py
        # Widening costs this job some install time and removes nothing.
        run: |
          uv venv .venv
          uv pip install -e ".[dev,server,http-client,db-postgres,db-mysql,db-sqlite,redis,monitoring,auth,auth-azure,trust,mcp,scheduler,telemetry,data,shamir]" --python .venv/bin/python
          uv pip install -e "packages/kailash-dataflow[dev,postgres-sync]" --python .venv/bin/python
          # Same sibling set as `test-root-regression` — root tests/regression/
          # imports these at module level and unguarded, so a missing one is a
          # collection error rather than a skip.
          uv pip install -e packages/kailash-mcp --python .venv/bin/python
          uv pip install -e packages/kailash-kaizen --python .venv/bin/python
          uv pip install -e packages/kailash-nexus --python .venv/bin/python
          uv pip install -e packages/kailash-pact --python .venv/bin/python
          uv pip install -e packages/kaizen-agents --python .venv/bin/python

      - name: Run Postgres/Redis-marked regression tests
        timeout-minutes: 10
        run: |
          cd packages/kailash-dataflow
          ../../.venv/bin/python -m pytest tests/regression/ \
            -m "requires_postgres or requires_redis" \
            --maxfail=10 -q --timeout=120

      # ISSUE #2002 AC#2 — the infra-marked root regression step lived HERE and
      # is REMOVED pending #2079. It hangs on this runner: given a 30-minute
      # budget it executed 3 of 22 tests and consumed the rest, with
      # pytest-timeout's stack dump naming a `dataflow_async__0` thread at
      # cross-event-loop pool disposal. The identical selection completes in
      # 244s against a real Postgres on macOS, so it is Linux/container
      # specific. A step that holds a runner for 30 minutes on every PR is a
      # real cost even when non-blocking, and a hang yields no signal in
      # exchange — so it is removed rather than made continue-on-error.
      #
      # The removed block, including the `env:` wiring for the FOUR different
      # DSN env var names those files read (TEST_DATABASE_URL,
      # DATAFLOW_TEST_POSTGRES_URL, TEST_POSTGRES_DSN, TEST_PG_URL — each
