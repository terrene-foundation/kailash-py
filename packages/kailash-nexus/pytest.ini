[pytest]
# Paths are resolved against rootdir, which for this file is the PACKAGE
# directory -- so `src` here means this package's src, NOT the repo root's.
# The repo root and every sibling package must therefore be listed
# explicitly, or `import kailash` falls through to the installed copy in
# site-packages. Entries are whitespace-separated and are NOT globbed.
pythonpath =
    src
    ../../src
    ../kailash-align/src
    ../kailash-dataflow/src
    ../kailash-kaizen/src
    ../kailash-mcp/src
    ../kailash-ml/src
    ../kailash-pact/src
    ../kaizen-agents/src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --import-mode=importlib
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (real services)
    e2e: End-to-end tests (complete flows)
    regression: Regression tests pinning a specific bug or invariant (per rules/testing.md § Regression Testing)
