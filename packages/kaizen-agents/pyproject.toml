[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaizen-agents"
version = "0.13.0"
description = "PACT-governed autonomous agent engines built on Kailash Kaizen SDK"
authors = [{name = "Terrene Foundation", email = "info@terrene.foundation"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ─────────────────────────────────────────────────────────────
    # kaizen-agents core. Audit (#890):
    # - kailash + kailash-kaizen + openai required (module-scope).
    # - httpx is function-local; small, kept core for ergonomics.
    # - kailash-pact, python-dotenv, structlog were all ORPHANS
    #   (zero imports anywhere in src/kaizen_agents/). DELETED.
    #   PACT semantics are reached via `kailash.trust.pact.*` (in
    #   `kailash` core), not the separate `kailash-pact` package.
    # ─────────────────────────────────────────────────────────────
    "kailash>=2.14.0",
    # FLOOR IS 2.46.0, RAISED FROM 2.36.0, AND THE RAISE IS RELEASE-BLOCKING —
    # not housekeeping. `kaizen-agents` imports symbols at MODULE scope that do
    # not exist at 2.36.0, so every user who upgrades `kaizen-agents` without
    # also upgrading `kailash-kaizen` gets an ImportError at
    # `import kaizen_agents` — a hard break at import, not a degraded path:
    #
    #   1. `kaizen.utils.credential_scrub` (52 files) — the whole MODULE is
    #      absent at 2.36.0. Created at c0c99b589; `scrub_local_error` added at
    #      943278479; `scrub_remote_error` added by the local/remote re-triage.
    #   2. `kaizen.llm.reasoning.ReasoningDegradedError` — ZERO occurrences in
    #      that module at 2.36.0. Added at 0066e4fcb.
    #   3. `kaizen.core.tool_formatters.normalize_tool_input_schema` — the
    #      module predates 2.36.0 but this symbol does not (0 occurrences
    #      there); added with the gated-`inputSchema: {}` normalization.
    #
    # All landed while `kailash-kaizen` already read 2.45.0, so 2.45.0's own
    # release artifact may PREDATE them; 2.46.0 (the next cut) is the first
    # version guaranteed to carry all three.
    #
    # (1) and (2) were found by resolving ALL 94 module-scope (module, symbol)
    # pairs in `kaizen_agents` against the tree at 8e7e952dc — the last commit
    # reading 2.36.0 — rather than by chasing the one symbol that surfaced the
    # bug; they were the only unresolved pairs at that time. Re-run that sweep
    # when adding any cross-package module-scope import: a module existing at
    # the floor does NOT imply the symbol does, which is exactly how (3) would
    # otherwise have slipped through.
    "kailash-kaizen>=2.46.0",  # module-scope credential_scrub + ReasoningDegradedError + normalize_tool_input_schema (see above); previously >=2.36.0 for the retired kaizen.providers.registry.get_provider_for_model + four-axis LlmClient.stream (#1720 Wave-2a/2b)
    "openai>=1.30.0",
    "httpx>=0.27.0",
    # Provider SDKs imported at runtime by the delegate / runtime adapters.
    # anthropic: delegate/adapters/anthropic_adapter.py + orchestration/adapters.py.
    # google-genai: delegate/adapters/google_adapter.py + runtime_adapters/gemini_cli.py
    #   (migrated off the deprecated google-generativeai per #1351).
    # A normal `pip install kaizen-agents` MUST resolve them or the Anthropic /
    # Gemini paths raise ImportError at adapter construction.
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    # platformdirs: per-user state dir for autonomous-agent checkpoints
    # (agents/autonomous/base.py::_default_checkpoint_dir) — module-scope import.
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
"Homepage" = "https://github.com/terrene-foundation/kailash-py"
"Bug Tracker" = "https://github.com/terrene-foundation/kailash-py/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests (Tier 1)",
    "integration: integration tests against real infrastructure (Tier 2)",
    "e2e: end-to-end tests against real everything (Tier 3)",
    "regression: regression tests pinning a fixed bug (NEVER delete)",
    "requires_real_llm: Tests that make real (billed) LLM provider calls; skipped unless KAIZEN_ALLOW_REAL_LLM=1",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# "I" (import sorting) is DELIBERATELY absent: isort already owns import order
# repo-wide via the pre-commit isort hook. With "I" selected here, ruff --fix and
# isort disagreed on first-party grouping and each undid the other's change, so
# `pre-commit run --all-files` never reached a fixed point — it re-"fixed" the
# same 83 files in this package on every pass. One tool owns import order (#1995).
select = ["E", "F", "UP", "B", "SIM"]
# Style-preference rules disabled at project level — kept the bug-class rules
# (E*, F*, B9*, UP*, SIM118) and only suppress nested-if / contextlib.suppress
# / negated-return / ternary-rewrite / dict-dispatch suggestions that frequently
# obscure intent in the agent / pattern code (clearer to leave nested if/try forms).
# Per-site `# noqa: <code>` is still preferred when the rule otherwise fires
# but the local intent argues for keeping the original form.
ignore = [
    "E501",   # line-length (Black handles this)
    "SIM102", # collapsible nested if — often clearer as written for agent code
    "SIM103", # negated return — readability is per-site judgment
    "SIM105", # contextlib.suppress — the try/except form is more grep-friendly here
    "SIM108", # ternary — nested if-else with explanatory branches stays clearer
    "SIM116", # dict dispatch — branch logic with side effects keeps if-elif
]

[tool.ruff.lint.isort]
known-first-party = ["kaizen", "kaizen_agents", "kailash"]

[tool.isort]
profile = "black"
# MUST match the root pyproject.toml list exactly — this previously carried only
# 3 of the 6 entries, so dataflow/nexus/pact were third-party here and
# first-party everywhere else (#1995).
known_first_party = ["kailash", "kaizen", "kaizen_agents", "dataflow", "nexus", "pact"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
