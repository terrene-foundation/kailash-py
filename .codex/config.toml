# Project Codex configuration. Trusted projects load this layer; command-line
# overrides and managed policy affect the effective configuration.
# Inspect with /debug-config and validate keys with --strict-config.
# Configuration profiles: --profile NAME loads $CODEX_HOME/NAME.config.toml.
# See https://learn.chatgpt.com/docs/config-file/config-basic

# Raise the project-document cap from the 32 KiB default to 64 KiB.
# Recheck the composed instruction size and effective loaded budget after emission.
project_doc_max_bytes = 65536

# Optional top-level settings belong before the first [table].
# Default model: select an available model through the current host or --model.
# Approval policy is separate from sandbox permissions and managed constraints.
# This commented example is not an active permission change.
# approval_policy = "on-request"

# Compatibility MCP adapter. Its declared tools are apply_patch, unified_exec
# and shell; registration does not establish interception of native tool calls.
# Native hooks have their own coverage and trust requirements (see /hooks).
[mcp_servers.codex-mcp-guard]
command = "node"
args = ["./.codex-mcp-guard/server.js"]
